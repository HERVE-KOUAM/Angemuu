<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Blog - Ange Muu</title>
    <!-- Existing styles -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/sass/style.css" rel="stylesheet">
    <!-- Müller-Brockmann Grid -->
    <link href="assets/css/blog.css" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <main class="blog-wrap">
            <div class="blog-grid">
                <header class="band" style="grid-column: 1 / -1;">
                    <h1>Article de Blog</h1>
                </header>
                
                <article class="band blog-content" style="grid-column: 1 / 13;">
                    <img src="assets/images/blog/img-13.jpg" alt="Blog Image" style="margin-bottom: var(--lh);">
                    <h2>Titre de l'article</h2>
                    <p>Contenu de l'article suivant la grille...</p>
                </article>

                <section class="band" id="comments-section" style="grid-column: 1 / 9;">
                    <h3>Commentaires</h3>
                    <div id="comments-list"></div>
                    <form id="comment-form" style="margin-top: var(--lh);">
                        <input type="text" id="comment-name" placeholder="Votre nom" required style="width: 100%; margin-bottom: var(--bl);">
                        <select id="comment-icon" style="margin-bottom: var(--bl);">
                            <option value="">Pas d'icône</option>
                            <option value="✂️">✂️</option>
                            <option value="✨">✨</option>
                            <option value="💄">💄</option>
                        </select>
                        <textarea id="comment-text" placeholder="Votre commentaire" required style="width: 100%; margin-bottom: var(--bl);"></textarea>
                        <button type="submit" class="theme-btn">Poster le commentaire</button>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/blog-comments.js"></script>
</body>
</html>
