<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Le blog d'Ange Muu : conseils, guides et tendances sur les tresses et les coiffures afro-américaines à Yaoundé.">
    <title>Le Blog d'Ange Muu — Tresses & Coiffures Afro</title>
    <link rel="canonical" href="https://angemuu.com/blog.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Le Blog d'Ange Muu — Tresses & Coiffures Afro">
    <meta property="og:description" content="Conseils, guides et tendances sur les tresses et les coiffures afro-américaines à Yaoundé.">
    <meta property="og:url" content="https://angemuu.com/blog.html">
    <meta property="og:image" content="https://angemuu.com/assets/images/blog/box-braids.jpg">
    <meta property="og:site_name" content="Ange Muu — Salon de coiffure Yaoundé">
    <meta property="og:locale" content="fr_FR">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Le Blog d'Ange Muu — Tresses & Coiffures Afro">
    <meta name="twitter:description" content="Conseils, guides et tendances sur les tresses et les coiffures afro-américaines à Yaoundé.">
    <meta name="twitter:image" content="https://angemuu.com/assets/images/blog/box-braids.jpg">

    <!-- JSON-LD Blog -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "Le Blog d'Ange Muu",
      "description": "Conseils, guides et tendances sur les tresses et les coiffures afro-américaines à Yaoundé.",
      "url": "https://angemuu.com/blog.html",
      "publisher": {
        "@type": "Organization",
        "name": "Ange Muu",
        "logo": { "@type": "ImageObject", "url": "https://angemuu.com/assets/images/logo-ange.png" }
      },
      "blogPost": [
        { "@type": "BlogPosting", "headline": "Box braids : le guide complet pour une pose réussie", "url": "https://angemuu.com/box-braids.html", "datePublished": "2026-01-15" },
        { "@type": "BlogPosting", "headline": "Cornrows ou box braids : quelle technique choisir ?", "url": "https://angemuu.com/cornrows-ou-box-braids.html", "datePublished": "2026-01-28" },
        { "@type": "BlogPosting", "headline": "Entretenir ses tresses : la routine qui change tout", "url": "https://angemuu.com/entretien-tresses.html", "datePublished": "2026-02-10" },
        { "@type": "BlogPosting", "headline": "Tendances tresses 2026 : les styles qui font sensation", "url": "https://angemuu.com/tendances-tresses-2026.html", "datePublished": "2026-02-25" }
      ]
    }
    </script>

    <!-- Grid Müller-Brockmann + identité Ange Muu -->
    <link href="assets/css/blog.css" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">

        <header class="site-head">
            <div class="blog-wrap">
                <nav class="band" style="padding: 24px 0 8px;">
                    <span style="grid-column: 1 / 4;">
                        <a class="brand-link" href="index.html">Ange <span class="alt">Muu</span></a>
                    </span>
                    <span style="grid-column: 10 / 13; text-align: right;">
                        <a class="nav-cta" href="index.html#reservation">Prendre RDV</a>
                    </span>
                </nav>
            </div>
        </header>

        <main class="blog-wrap" style="padding-top: 64px; padding-bottom: 120px;">
            <div class="blog-grid">

                <header class="band" style="margin-bottom: 48px;">
                    <p class="header-kicker" style="grid-column: 1 / 13; margin-bottom: 16px;">Conseils — Guides — Tendances</p>
                    <h1 class="display-title" style="grid-column: 1 / 13;">
                        Le Blog<br><span class="soft">d'Ange Muu</span>
                    </h1>
                    <p class="lede" style="grid-column: 1 / 6; margin-top: 16px;">
                        Tresses et coiffures afro-américaines, pensées pour votre quotidien à Yaoundé.
                    </p>
                </header>

                <section class="band" id="post-list" style="grid-column: 1 / 13;">
                    <!-- Articles générés depuis assets/js/blog-data.js -->
                </section>

            </div>
        </main>

        <footer class="site-foot">
            <div class="blog-wrap">
                <div class="blog-grid">
                    <p class="foot-note" style="grid-column: 1 / 13; padding: 16px 0 24px;">
                        © 2026 <a href="index.html" style="text-decoration: none;">Ange Muu</a> — Salon de coiffure, Yaoundé. Tous droits réservés.
                    </p>
                </div>
            </div>
        </footer>
    </div>

    <script src="assets/js/blog-data.js"></script>
    <script>
        // ============================================================
        // RENDERING DU LISTING — articles depuis window.BLOG_POSTS
        // Une rangée par article : numéro / méta+titre / extrait / image
        // ============================================================
        document.addEventListener('DOMContentLoaded', function () {
            const list = document.getElementById('post-list');
            const posts = window.BLOG_POSTS || [];

            if (posts.length === 0) {
                list.innerHTML = '<p class="lede" style="grid-column: 1 / 13;">Aucun article pour le moment.</p>';
                return;
            }

            list.innerHTML = posts.map(function (post, index) {
                const n = String(index + 1).padStart(2, '0');
                const dateFr = new Date(post.date + 'T00:00:00').toLocaleDateString('fr-FR', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });

                const pageLink = post.page || 'blog-single.html?slug=' + encodeURIComponent(post.slug);

                return `
                    <article class="band post-row" style="grid-column: 1 / 13;">
                        <span class="post-num" style="grid-column: 1 / 2;">${n}</span>
                        <div class="post-body" style="grid-column: 2 / 6;">
                            <p class="post-meta">${post.category} — ${dateFr}</p>
                            <h2 class="post-title"><a href="${pageLink}">${post.title}</a></h2>
                        </div>
                        <div class="post-body" style="grid-column: 6 / 10;">
                            <p class="post-excerpt">${post.excerpt}</p>
                        </div>
                        <div class="post-thumb-box" style="grid-column: 10 / 13; text-align: right;">
                            <img class="post-thumb" src="${post.image}" alt="${post.title}">
                            <p class="post-read">${post.readTime} de lecture</p>
                        </div>
                    </article>
                `;
            }).join('');
        });
    </script>
</body>
</html>
